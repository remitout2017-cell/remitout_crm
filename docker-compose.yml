services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: remitout_crm
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend_and_ai
    env_file:
      - ./backend_and_ai/.env
    environment:
      # Overrides the .env value: inside the compose network the DB is reached by service name, not localhost.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/remitout_crm
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_ADMIN_KEY: ${VITE_ADMIN_KEY}
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
