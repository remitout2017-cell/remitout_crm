server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS; resolved per-request (a variable) so nginx doesn't fail
    # to start if "backend" isn't resolvable yet at config-load time.
    resolver 127.0.0.11 valid=30s;

    # Same rewrite the Vite dev proxy does: strip /api before forwarding to the backend.
    location /api/ {
        set $backend_upstream backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }
}
